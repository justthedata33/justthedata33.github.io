<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:8px 16px 32px}
h1{margin:4px 0 6px;font-size:26px;font-weight:700}

.pick label{color:var(--muted);font-size:14px}
select{min-height:44px;min-width:240px;padding:0 14px;border-radius:999px;border:1px solid rgba(60,207,126,.45);

.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%}
