.wrap{max-width:920px;margin:0 auto;padding:8px 16px 32px}

select{min-height:44px;min-width:240px;padding:0 14px;border-radius:999px;border:1px solid rgba(60,207,126,.45);

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
